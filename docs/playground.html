<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>notae -Playground</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .example-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 4px;
    }
    .example-chip {
      font-size: 11px;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
      color: var(--text-muted, #999);
      font-family: 'Courier New', monospace;
      transition: color 0.12s;
    }
    .example-chip:hover {
      color: #5aaa5a;
    }
    .example-chips {
      gap: 0;
    }
    .example-chip + .example-chip::before {
      content: ' · ';
      color: var(--text-muted, #bbb);
    }

    .tuning-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tuning-row select { flex: 1; }
    .position-inline {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .position-inline input[type="range"] {
      width: 60px;
      height: 4px;
      appearance: none;
      -webkit-appearance: none;
      background: #ddd;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    [data-theme="dark"] .position-inline input[type="range"] { background: #444; }
    .position-inline input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #5aaa5a;
      cursor: pointer;
      border: none;
    }
    .position-inline input[type="range"]::-moz-range-thumb {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #5aaa5a;
      cursor: pointer;
      border: none;
    }
    .position-inline span {
      font-size: 11px;
      color: #888;
      min-width: 28px;
      white-space: nowrap;
    }
    .string-tuner {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .string-pin {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .string-pin-note {
      font-size: 11px;
      font-family: 'Courier New', monospace;
      color: #555;
      min-width: 26px;
      text-align: center;
      line-height: 1.4;
    }
    [data-theme="dark"] .string-pin-note {
      color: #aaa;
    }
    .string-pin-btn {
      width: 26px;
      height: 13px;
      font-size: 8px;
      line-height: 1;
      border: 1px solid #ddd;
      border-radius: 2px;
      background: none;
      cursor: pointer;
      color: #999;
      padding: 0;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    [data-theme="dark"] .string-pin-btn {
      border-color: #444;
      color: #666;
    }
    .string-pin-btn:hover {
      background: #5aaa5a;
      color: #fff;
      border-color: #5aaa5a;
    }

    .playground-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    @media (max-width: 1024px) {
      .playground-container {
        grid-template-columns: 1fr;
      }
    }

    .controls-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label {
      font-size: 12px;
      font-weight: 500;
      color: #555;
    }

    [data-theme="dark"] .input-group label {
      color: #999;
    }

    .input-group input[type="text"],
    .input-group select {
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
      box-sizing: border-box;
    }

    [data-theme="dark"] .input-group input[type="text"],
    [data-theme="dark"] .input-group select {
      background-color: #1e1e1e;
      color: #e0e0e0;
      border-color: #444;
    }

    .input-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 10px;
      align-items: end;
    }

    .tweaks-panel {
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
      background: #fafafa;
    }

    [data-theme="dark"] .tweaks-panel {
      background: #1a1a1a;
      border-color: #333;
    }

    .tweaks-tabs {
      display: flex;
      border-bottom: 1px solid #ddd;
      background: #f5f5f5;
    }

    [data-theme="dark"] .tweaks-tabs {
      background: #111;
      border-color: #333;
    }

    .tweaks-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: transparent;
      color: #666;
      border-bottom: 2px solid transparent;
    }

    [data-theme="dark"] .tweaks-tab {
      color: #999;
    }

    .tweaks-tab.active {
      color: #000;
      border-bottom-color: #5aaa5a;
    }

    [data-theme="dark"] .tweaks-tab.active {
      color: #e0e0e0;
      border-bottom-color: #5aaa5a;
    }

    .tweaks-content {
      display: none;
      padding: 16px;
      overflow-y: auto;
      max-height: 400px;
    }

    .tweaks-content.active {
      display: block;
    }

    .tweaks-content.active.tweaks-colors-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px 12px;
      align-items: start;
    }

    .tweak-item {
      margin-bottom: 14px;
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 10px;
      align-items: center;
    }

    .tweak-label {
      font-size: 12px;
      font-weight: 500;
      color: #666;
    }

    [data-theme="dark"] .tweak-label {
      color: #aaa;
    }

    .tweak-control {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .tweak-control input[type="range"] {
      flex: 1;
      height: 4px;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background: #ddd;
      border-radius: 2px;
      outline: none;
    }
    [data-theme="dark"] .tweak-control input[type="range"] {
      background: #444;
    }
    .tweak-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #5aaa5a;
      cursor: pointer;
      border: none;
    }
    .tweak-control input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #5aaa5a;
      cursor: pointer;
      border: none;
    }
    .tweak-control input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 2px;
    }
    .tweak-control input[type="range"]::-moz-range-track {
      height: 4px;
      background: #ddd;
      border-radius: 2px;
    }
    [data-theme="dark"] .tweak-control input[type="range"]::-moz-range-track {
      background: #444;
    }

    .tweak-control input[type="number"] {
      width: 50px;
      padding: 4px 6px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }

    [data-theme="dark"] .tweak-control input[type="number"] {
      background: #2a2a2a;
      color: #e0e0e0;
      border-color: #444;
    }

    .tweak-control input[type="color"] {
      width: 40px;
      height: 28px;
      border: 1px solid #ccc;
      border-radius: 3px;
      cursor: pointer;
    }

    .tweak-control select {
      padding: 4px 6px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }

    [data-theme="dark"] .tweak-control select {
      background: #2a2a2a;
      color: #e0e0e0;
      border-color: #444;
    }

    .output-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .diagram-wrap {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 16px;
      background: #fff;
      overflow-x: auto;
      min-height: 300px;
    }

    [data-theme="dark"] .diagram-wrap {
      background: #1a1a1a;
      border-color: #333;
    }

    #diagram {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .code-wrap {
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #f5f5f5;
      overflow: hidden;
    }

    [data-theme="dark"] .code-wrap {
      background: #0d0d0d;
      border-color: #333;
    }

    .code-header {
      padding: 10px 12px;
      border-bottom: 1px solid #ddd;
      font-size: 12px;
      font-weight: 500;
      color: #666;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    [data-theme="dark"] .code-header {
      border-color: #333;
      color: #999;
    }

    .btn-copy {
      padding: 4px 8px;
      font-size: 11px;
      background: #5aaa5a;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-copy:hover {
      background: #4a9a4a;
    }

    .code-block {
      padding: 12px;
      font-size: 11px;
      font-family: 'Courier New', monospace;
      color: #333;
      overflow: auto;
      white-space: pre;
      max-height: 180px;
    }

    [data-theme="dark"] .code-block {
      color: #e0e0e0;
      background: #1a1a1a;
    }

    .error-msg {
      padding: 12px;
      background: #fee;
      color: #c33;
      border-radius: 4px;
      font-size: 13px;
    }

    [data-theme="dark"] .error-msg {
      background: #3a1a1a;
      color: #f77;
    }
  </style>
</head>
<body>

<header>
  <nav>
    <a href="index.html" class="logo">notae</a>
    <span style="font-size:13px;color:#aaa;font-weight:400">Playground</span>
    <div class="nav-links">
      <a href="https://github.com/memoriainfinita/notae" target="_blank" rel="noopener">GitHub</a>
      <button id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">◑</button>
    </div>
  </nav>
</header>

<div class="playground-container">
  <div class="controls-section">
    <div class="input-row">
      <div class="input-group">
        <label>Chord or scale</label>
        <input
          type="text"
          id="symbol-input"
          placeholder="Cmaj7, C major, D dorian, F# blues..."
          autocomplete="off"
        >
      </div>
      <div class="input-group">
        <label>Renderer</label>
        <select id="renderer-select">
          <option value="fretboard">Fretboard</option>
          <option value="piano">Piano</option>
          <option value="bowed">Bowed strings</option>
        </select>
      </div>
      <div class="input-group">
        <label>Tuning</label>
        <div class="tuning-row">
          <select id="tuning-select"></select>
          <div id="position-group" class="position-inline" style="display:none">
            <input type="range" id="chord-position" min="1" max="12" value="1">
            <span id="chord-position-label">1</span>
          </div>
        </div>
        <input type="text" id="custom-tuning-input" placeholder="e.g. G3 D4 A4 E5  (max 12 strings)" autocomplete="off" style="display:none;margin-top:4px;">
        <div id="string-tuner" class="string-tuner"></div>
        <div id="custom-tuning-presets" class="example-chips" style="display:none;margin-top:4px;">
          <button class="example-chip" data-tuning="D3">Monochord (1)</button>
          <button class="example-chip" data-tuning="G3 D4">Cigar box (2)</button>
          <button class="example-chip" data-tuning="G3 D4 G4">Cigar box (3)</button>
          <button class="example-chip" data-tuning="G2 D3 A3 E4">Mandola (4)</button>
          <button class="example-chip" data-tuning="B0 E1 A1 D2 G2">5-string bass</button>
          <button class="example-chip" data-tuning="E2 A2 D3 G3 B3 E4">Guitar (6)</button>
          <button class="example-chip" data-tuning="B1 E2 A2 D3 G3 B3 E4">7-string (7)</button>
          <button class="example-chip" data-tuning="F#1 B1 E2 A2 D3 G3 B3 E4">8-string (8)</button>
        </div>
      </div>
    </div>
    <div class="example-chips" style="margin-top:2px">
      <button class="example-chip" data-symbol="Cmaj7">Cmaj7</button>
      <button class="example-chip" data-symbol="Am7">Am7</button>
      <button class="example-chip" data-symbol="G">G</button>
      <button class="example-chip" data-symbol="F#m11">F#m11</button>
      <button class="example-chip" data-symbol="C major">C major</button>
      <button class="example-chip" data-symbol="D dorian">D dorian</button>
      <button class="example-chip" data-symbol="F# blues">F# blues</button>
      <button class="example-chip" data-symbol="Bb harmonic minor">Bb harmonic minor</button>
    </div>

    <div class="tweaks-panel">
      <div class="tweaks-tabs">
        <button class="tweaks-tab active" data-tab="general">General</button>
        <button class="tweaks-tab" data-tab="fretboard">Fretboard</button>
        <button class="tweaks-tab" data-tab="piano">Piano</button>
        <button class="tweaks-tab" data-tab="colors">Colors</button>
        <button class="tweaks-tab" data-tab="box">Box</button>
        <button class="tweaks-tab" data-tab="filter">Filter</button>
      </div>

      <div id="tweaks-general" class="tweaks-content active">
        <div class="tweak-item">
          <label class="tweak-label">Orientation</label>
          <div class="tweak-control">
            <select id="orientation">
              <option value="vertical">Vertical</option>
              <option value="horizontal">Horizontal</option>
            </select>
          </div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">Chord name size</label>
          <div class="tweak-control">
            <input type="range" id="chordNameSize" min="10" max="30" value="17">
            <input type="number" id="chordNameSize-num" min="10" max="30" value="17">
          </div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">Chord name Y</label>
          <div class="tweak-control">
            <input type="range" id="chordNameY" min="15" max="45" value="30">
            <input type="number" id="chordNameY-num" min="15" max="45" value="30">
          </div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">Chord name gap (vertical)</label>
          <div class="tweak-control">
            <input type="range" id="chordNameGap" min="0" max="30" value="11">
            <input type="number" id="chordNameGap-num" min="0" max="30" value="11">
          </div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">Chord name gap (horizontal)</label>
          <div class="tweak-control">
            <input type="range" id="chordNameGapH" min="0" max="50" value="32">
            <input type="number" id="chordNameGapH-num" min="0" max="50" value="32">
          </div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">Chord name gap (piano)</label>
          <div class="tweak-control">
            <input type="range" id="chordNameGapP" min="0" max="30" value="17">
            <input type="number" id="chordNameGapP-num" min="0" max="30" value="17">
          </div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">Show finger numbers</label>
          <div class="tweak-control"><input type="checkbox" id="showFingerNumbers" checked></div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">Show degrees (R 3 5)</label>
          <div class="tweak-control"><input type="checkbox" id="showDegrees"></div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">Left handed</label>
          <div class="tweak-control"><input type="checkbox" id="leftHanded"></div>
        </div>
      </div>

      <div id="tweaks-fretboard" class="tweaks-content">
        <div class="tweak-item">
          <label class="tweak-label">Num frets</label>
          <div class="tweak-control">
            <input type="range" id="numFrets" min="4" max="15" value="5">
            <input type="number" id="numFrets-num" min="4" max="15" value="5">
          </div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">String spacing</label>
          <div class="tweak-control">
            <input type="range" id="stringSpacing" min="12" max="32" value="19">
            <input type="number" id="stringSpacing-num" min="12" max="32" value="19">
          </div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">Fret spacing</label>
          <div class="tweak-control">
            <input type="range" id="fretSpacing" min="15" max="40" value="23">
            <input type="number" id="fretSpacing-num" min="15" max="40" value="23">
          </div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">Dot radius</label>
          <div class="tweak-control">
            <input type="range" id="dotRadius" min="5" max="15" value="9">
            <input type="number" id="dotRadius-num" min="5" max="15" value="9">
          </div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">String width</label>
          <div class="tweak-control">
            <input type="range" id="stringWidth" min="0.5" max="4" step="0.5" value="1">
            <input type="number" id="stringWidth-num" min="0.5" max="4" step="0.5" value="1">
          </div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">Fret width</label>
          <div class="tweak-control">
            <input type="range" id="fretWidth" min="0.5" max="4" step="0.5" value="1">
            <input type="number" id="fretWidth-num" min="0.5" max="4" step="0.5" value="1">
          </div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">Nut width</label>
          <div class="tweak-control">
            <input type="range" id="nutWidth" min="1" max="10" value="4">
            <input type="number" id="nutWidth-num" min="1" max="10" value="4">
          </div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">Indicator size</label>
          <div class="tweak-control">
            <input type="range" id="indicatorSize" min="2" max="10" value="4">
            <input type="number" id="indicatorSize-num" min="2" max="10" value="4">
          </div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">Indicator zone size</label>
          <div class="tweak-control">
            <input type="range" id="indicatorZoneSize" min="10" max="30" value="18">
            <input type="number" id="indicatorZoneSize-num" min="10" max="30" value="18">
          </div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">Fret label size</label>
          <div class="tweak-control">
            <input type="range" id="fretLabelSize" min="8" max="16" value="11">
            <input type="number" id="fretLabelSize-num" min="8" max="16" value="11">
          </div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">Fret label gap (vertical)</label>
          <div class="tweak-control">
            <input type="range" id="fretLabelGap" min="8" max="32" value="20">
            <input type="number" id="fretLabelGap-num" min="8" max="32" value="20">
          </div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">Fret label gap (horizontal)</label>
          <div class="tweak-control">
            <input type="range" id="fretLabelGapH" min="4" max="20" value="8">
            <input type="number" id="fretLabelGapH-num" min="4" max="20" value="8">
          </div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">String label size</label>
          <div class="tweak-control">
            <input type="range" id="stringLabelSize" min="8" max="16" value="11">
            <input type="number" id="stringLabelSize-num" min="8" max="16" value="11">
          </div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">String label gap</label>
          <div class="tweak-control">
            <input type="range" id="stringLabelGap" min="0" max="12" value="4">
            <input type="number" id="stringLabelGap-num" min="0" max="12" value="4">
          </div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">String label mode</label>
          <div class="tweak-control">
            <select id="stringLabelMode">
              <option value="tuning">Tuning</option>
              <option value="notes">Notes</option>
            </select>
          </div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">String label position</label>
          <div class="tweak-control">
            <select id="stringLabelPosition">
              <option value="bottom">Bottom</option>
              <option value="top">Top</option>
            </select>
          </div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">Bowed tick size</label>
          <div class="tweak-control">
            <input type="range" id="bowedTickSize" min="2" max="12" value="5">
            <input type="number" id="bowedTickSize-num" min="2" max="12" value="5">
          </div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">Show string labels</label>
          <div class="tweak-control"><input type="checkbox" id="showStringLabels" checked></div>
        </div>
      </div>

      <div id="tweaks-piano" class="tweaks-content">
        <div class="tweak-item">
          <label class="tweak-label">White key width</label>
          <div class="tweak-control">
            <input type="range" id="pianoWhiteKeyW" min="20" max="44" value="28">
            <input type="number" id="pianoWhiteKeyW-num" min="20" max="44" value="28">
          </div>
        </div>
        <div class="tweak-item">
          <label class="tweak-label">White key height</label>
          <div class="tweak-control">
